<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge OS</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; height: 100vh; flex-direction: column; }
        header { background: #1e293b; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .chat { width: 50%; display: flex; flex-direction: column; border-right: 1px solid #334155; padding: 15px; }
        .preview { width: 50%; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
        .messages { flex: 1; overflow-y: auto; background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .input-box { display: flex; gap: 10px; }
        textarea { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; resize: none; height: 40px; }
        button { padding: 10px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <header>
        <h2>⚡ Forge OS — Aplicativo Principal</h2>
        <span>Utilizador Ativo</span>
    </header>
    <div class="main">
        <div class="chat">
            <h3>Assistente de Criação</h3>
            <div id="messages" class="messages">
                <p><b>Sistema:</b> Forge OS carregado com sucesso! Escreve algo em baixo para testar.</p>
            </div>
            <div class="input-box">
                <textarea id="prompt" placeholder="Descreve o que queres criar..."></textarea>
                <button onclick="gerarApp()">Enviar</button>
            </div>
        </div>
        <div class="preview">
            <iframe id="frame"></iframe>
        </div>
    </div>

    <script>
        function gerarApp() {
            const texto = document.getElementById('prompt').value;
            if(!texto) return;
            
            const msgBox = document.getElementById('messages');
            msgBox.innerHTML += `<p><b>Tu:</b> ${texto}</p>`;
            
            // Código gerado para pré-visualização instantânea
            const codigoHtml = `<!DOCTYPE html><html><body style="font-family:sans-serif;padding:20px;background:#f0fdf4;color:#166534;"><h1>Projeto: ${texto}</h1><p>A funcionar perfeitamente!</p></body></html>`;
            
            document.getElementById('frame').srcdoc = codigoHtml;
            document.getElementById('prompt').value = '';
            msgBox.scrollTop = msgBox.scrollHeight;
        }
    </script>
</body>
</html>
