<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge OS | Cloud AI</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-screen" class="overlay">
        <div class="panel">
            <h2>Forge Login</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="handleAuth('login')">Login</button>
            <button onclick="handleAuth('signup')">Sign Up</button>
        </div>
    </div>

    <div id="app" style="display:none;">
        <aside class="sidebar">
            <div class="logo">FORGE OS</div>
            <div id="project-list"></div>
            <button onclick="createNewProject()">+ Novo Projeto</button>
            <button onclick="firebase.auth().signOut()">Logout</button>
        </aside>
        <main class="workspace">
            <header class="top-bar">
                <h3 id="current-project-title">Sem projeto</h3>
                <button onclick="saveProject()">Guardar na Cloud</button>
            </header>
            <textarea id="editor"></textarea>
        </main>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAwypnuWEXalIc0MJ_lAot8dpJGXQ6vaOg",
            authDomain: "ai-app-aed75.firebaseapp.com",
            projectId: "ai-app-aed75",
            storageBucket: "ai-app-aed75.firebasestorage.app",
            messagingSenderId: "246244531639",
            appId: "1:246244531639:web:839eb552c9c8e22c1e9c32"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let currentProjectId = null;

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                loadProjects();
            }
        });

        async function handleAuth(type) {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                if (type === 'login') await firebase.auth().signInWithEmailAndPassword(email, pass);
                else await firebase.auth().createUserWithEmailAndPassword(email, pass);
            } catch (e) { alert(e.message); }
        }

        async function loadProjects() {
            const uid = firebase.auth().currentUser.uid;
            const snapshot = await db.collection('users').doc(uid).collection('projects').get();
            const list = document.getElementById('project-list');
            list.innerHTML = '';
            snapshot.forEach(doc => {
                const div = document.createElement('div');
                div.innerText = doc.data().name;
                div.onclick = () => openProject(doc.id, doc.data());
                list.appendChild(div);
            });
        }

        async function saveProject() {
            const uid = firebase.auth().currentUser.uid;
            const data = {
                name: document.getElementById('current-project-title').innerText,
                content: document.getElementById('editor').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            if (currentProjectId) {
                await db.collection('users').doc(uid).collection('projects').doc(currentProjectId).update(data);
            } else {
                const doc = await db.collection('users').doc(uid).collection('projects').add(data);
                currentProjectId = doc.id;
            }
            alert("Guardado na Cloud!");
        }

        function openProject(id, data) {
            currentProjectId = id;
            document.getElementById('current-project-title').innerText = data.name;
            document.getElementById('editor').value = data.content;
        }

        async function createNewProject() {
            const name = prompt("Nome do projeto:");
            if (name) {
                currentProjectId = null;
                document.getElementById('current-project-title').innerText = name;
                document.getElementById('editor').value = "";
            }
        }
    </script>
</body>
</html>
